packages:
  - configs/*
  - plugins/*

catalog:
  '@types/node': ^26.6.6
  '@typescript/native': npm:typescript@7.1.0-beta
  '@oxlint/plugins': ^1.94.0
  '@tanstack/eslint-plugin-query': ^5.107.1
  eslint: ^10.14.0
  eslint-plugin-oxlint: ^1.94.0
  oxfmt: ^0.80.0
  oxlint: ^1.95.0
  oxlint-plugin-eslint: ^1.94.0
  oxlint-tsgolint: ^7.0.2008
  tsdown: 0.23.7
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-eslint: ^8.73.0
  vitest: ^5.1.0

autoDedupe: true

catalogPrune: true

engineStrict: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeStrict: true

saveTypes: true

trustPolicy: no-downgrade
