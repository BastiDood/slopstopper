packages:
  - configs/*
  - plugins/*

catalog:
  '@typescript/native': npm:typescript@^7.0.2
  eslint: ^10.13.0
  eslint-plugin-oxlint: ^1.90.0
  oxfmt: ^0.75.0
  oxlint: ^1.90.0
  oxlint-plugin-eslint: ^1.90.0
  oxlint-tsgolint: ^7.0.2005
  tsdown: ^0.23.2
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-eslint: ^8.72.1
  vitest: ^5.0.5

allowBuilds:
  unrs-resolver: false

autoDedupe: true

catalogPrune: true

engineStrict: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeStrict: true

saveTypes: true

trustPolicy: no-downgrade
