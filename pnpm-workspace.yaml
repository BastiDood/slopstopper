packages:
  - configs/*
  - plugins/*

catalog:
  '@types/node': ^26.6.6
  '@typescript/native': npm:typescript@^7.0.2
  '@oxlint/plugins': ^1.93.0
  '@tanstack/eslint-plugin-query': ^5.107.1
  eslint: ^10.14.0
  eslint-plugin-oxlint: ^1.93.0
  oxfmt: ^0.78.0
  oxlint: ^1.93.0
  oxlint-plugin-eslint: ^1.93.0
  oxlint-tsgolint: ^7.0.2007
  tsdown: 0.23.5
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-eslint: ^8.72.2
  vitest: ^5.1.0

allowBuilds:
  unrs-resolver: false

autoDedupe: true

catalogPrune: true

engineStrict: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeStrict: true

saveTypes: true

trustPolicy: no-downgrade
